<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FlipZoom">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>FlipZoom</title>
<style>
  :root {
    --glass: rgba(255,255,255,0.14);
    --glass-strong: rgba(255,255,255,0.22);
    --edge: rgba(255,255,255,0.35);
    --text: #f5f5f7;
    --red: #ff3b30;
    --safe-t: env(safe-area-inset-top);
    --safe-b: env(safe-area-inset-bottom);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--text);
    font: 15px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none; touch-action: none; }
  #stage { position: fixed; inset: 0; background: #000; }
  #preview { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #preview.mirror { transform: scaleX(-1); }
  #src { position: absolute; width: 2px; height: 2px; opacity: 0; pointer-events: none; }

  .glass {
    background: linear-gradient(180deg, var(--glass-strong), var(--glass));
    -webkit-backdrop-filter: blur(22px) saturate(180%); backdrop-filter: blur(22px) saturate(180%);
    border: 0.5px solid var(--edge);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), inset 0 -1px 0 rgba(0,0,0,0.15), 0 8px 30px rgba(0,0,0,0.35);
  }
  button { font: inherit; color: var(--text); border: 0; cursor: pointer; }

  #top { position: absolute; left: 0; right: 0; top: calc(var(--safe-t) + 10px); display: flex; justify-content: center; pointer-events: none; }
  #timer { padding: 6px 14px; border-radius: 999px; font-variant-numeric: tabular-nums; font-weight: 600; letter-spacing: .3px; display: flex; align-items: center; gap: 8px; }
  #timer .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.5); }
  body.rec #timer .dot { background: var(--red); animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .25; } }

  #zoomwrap { position: absolute; left: 0; right: 0; bottom: calc(var(--safe-b) + 150px); display: flex; flex-direction: column; align-items: center; gap: 12px; }
  #presets { display: flex; gap: 6px; padding: 5px; border-radius: 999px; }
  #presets button { min-width: 44px; height: 36px; padding: 0 10px; border-radius: 999px; background: transparent; font-weight: 600; font-size: 13px; }
  #presets button.on { background: rgba(255,255,255,.9); color: #000; }
  #sliderbox { width: min(78vw, 340px); padding: 10px 16px; border-radius: 999px; display: flex; align-items: center; gap: 10px; }
  #zoomlabel { min-width: 52px; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
  input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; height: 4px; background: rgba(255,255,255,.35); border-radius: 2px; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.4); }

  #bar { position: absolute; left: 0; right: 0; bottom: calc(var(--safe-b) + 24px); display: flex; align-items: center; justify-content: space-evenly; }
  .round { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; }
  .round svg { width: 26px; height: 26px; fill: none; stroke: #fff; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #shutter { width: 84px; height: 84px; border-radius: 50%; padding: 6px; background: transparent; border: 4px solid rgba(255,255,255,.95); box-shadow: 0 6px 24px rgba(0,0,0,.4); }
  #shutter i { display: block; width: 100%; height: 100%; border-radius: 50%; background: var(--red); transition: all .22s cubic-bezier(.3,.7,.3,1); }
  body.rec #shutter i { transform: scale(.5); border-radius: 10px; }
  #clipsbtn { position: relative; }
  #clipsbtn b { position: absolute; top: -2px; right: -2px; min-width: 20px; height: 20px; border-radius: 10px; background: var(--red); font-size: 12px; display: none; place-items: center; padding: 0 5px; }
  #clipsbtn b.show { display: grid; }

  #toast { position: absolute; left: 50%; top: calc(var(--safe-t) + 56px); transform: translateX(-50%); padding: 8px 14px; border-radius: 14px; font-size: 13px; opacity: 0; transition: opacity .25s; pointer-events: none; max-width: 86vw; text-align: center; }
  #toast.show { opacity: 1; }

  .sheet { position: fixed; left: 8px; right: 8px; bottom: calc(var(--safe-b) + 8px); border-radius: 30px; padding: 18px; display: none; max-height: 80vh; overflow: auto; touch-action: pan-y; }
  .sheet.show { display: block; }
  .sheet h2 { margin: 0 0 12px; font-size: 18px; }
  .sheet p { margin: 0 0 12px; color: rgba(255,255,255,.8); font-size: 14px; }
  .clip { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-top: .5px solid rgba(255,255,255,.18); }
  .clip video { width: 64px; height: 96px; object-fit: cover; border-radius: 10px; background: #111; }
  .clip .meta { flex: 1; font-size: 13px; }
  .pill { padding: 10px 14px; border-radius: 999px; background: rgba(255,255,255,.9); color: #000; font-weight: 600; font-size: 14px; }
  .pill.ghost { background: rgba(255,255,255,.16); color: #fff; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

  #gate { position: fixed; inset: 0; display: grid; place-items: center; padding: 30px; text-align: center; background: radial-gradient(circle at 50% 30%, #23233a, #000 70%); }
  #gate h1 { font-size: 30px; margin: 0 0 8px; }
  #gate p { color: rgba(255,255,255,.75); margin: 0 0 22px; }
  #gate.hide { display: none; }
</style>
</head>
<body>
<div id="stage">
  <video id="src" playsinline muted autoplay></video>
  <canvas id="preview"></canvas>
</div>

<div id="top"><div id="timer" class="glass"><span class="dot"></span><span id="time">00:00</span></div></div>
<div id="toast" class="glass"></div>

<div id="zoomwrap">
  <div id="presets" class="glass"></div>
  <div id="sliderbox" class="glass">
    <input id="zoom" type="range" min="0" max="1000" value="0" aria-label="Zoom">
    <span id="zoomlabel">1.0×</span>
  </div>
</div>

<div id="bar">
  <button id="clipsbtn" class="round glass" aria-label="Clips">
    <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4-2.5z" fill="#fff"/></svg><b id="badge"></b>
  </button>
  <button id="shutter" aria-label="Record"><i></i></button>
  <button id="flip" class="round glass" aria-label="Flip camera">
    <svg viewBox="0 0 24 24"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><path d="M9 13.5a3 3 0 0 1 5.2-2"/><path d="M15 13.5a3 3 0 0 1-5.2 2"/><path d="M14.4 9.6v2h-2"/><path d="M9.6 17.4v-2h2"/></svg>
  </button>
</div>

<div id="clips" class="sheet glass">
  <div class="row" style="justify-content:space-between;align-items:center"><h2>Clips on this phone</h2><button class="pill ghost" id="closeclips">Done</button></div>
  <p>Tap <b>Save</b>, then choose <b>Save Video</b> to put a clip in Photos. Clips stay here until you delete them.</p>
  <div id="cliplist"></div>
</div>

<div id="gate">
  <div>
    <h1>FlipZoom</h1>
    <p>Record video, flip front and back without stopping, and zoom while recording.</p>
    <button id="start" class="pill">Start camera</button>
    <p id="gateerr" style="margin-top:18px;color:#ff8a80"></p>
  </div>
</div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const video = $('src'), canvas = $('preview'), ctx = canvas.getContext('2d', { alpha: false });
const OUT_W = 1080, OUT_H = 1920, FPS = 30, DIGITAL_MAX = 5;

const S = {
  facing: 'environment', videoTrack: null, audioTrack: null,
  hwMin: 1, hwMax: 1, hwStep: 0.01, hasHw: false,
  zoom: 1, maxZoom: DIGITAL_MAX, recorder: null, chunks: [], recStart: 0,
  switching: false, wakeLock: null, pendingHw: null, hwBusy: false,
};
canvas.width = OUT_W; canvas.height = OUT_H;

function toast(msg, ms = 2200) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), ms);
}

// ---------- camera ----------
async function openVideo(facing) {
  const constraints = { video: { facingMode: { ideal: facing }, width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: FPS } } };
  const stream = await navigator.mediaDevices.getUserMedia(constraints);
  const track = stream.getVideoTracks()[0];
  S.videoTrack = track;
  video.srcObject = new MediaStream([track]);
  await video.play().catch(() => {});
  readZoomCaps();
  canvas.classList.toggle('mirror', facing === 'user');
}

function readZoomCaps() {
  const caps = S.videoTrack && S.videoTrack.getCapabilities ? S.videoTrack.getCapabilities() : {};
  if (caps.zoom && caps.zoom.max > caps.zoom.min) {
    S.hasHw = true; S.hwMin = caps.zoom.min; S.hwMax = caps.zoom.max; S.hwStep = caps.zoom.step || 0.01;
    S.maxZoom = S.hwMax / S.hwMin;
  } else {
    S.hasHw = false; S.hwMin = 1; S.hwMax = 1; S.maxZoom = DIGITAL_MAX;
  }
  S.zoom = Math.min(S.zoom, S.maxZoom);
  buildPresets(); applyZoom(S.zoom, true);
}

async function start() {
  $('gateerr').textContent = '';
  try {
    const a = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: true } });
    S.audioTrack = a.getAudioTracks()[0];
  } catch (e) { toast('No microphone access. Video will record without sound.', 3500); }
  try {
    await openVideo(S.facing);
  } catch (e) {
    $('gateerr').textContent = 'Camera blocked: ' + (e.message || e.name) + '. In Settings › Safari › Camera, choose Ask or Allow, then try again.';
    return;
  }
  $('gate').classList.add('hide');
  draw();
}

async function flip() {
  if (S.switching) return;
  S.switching = true;
  const next = S.facing === 'environment' ? 'user' : 'environment';
  const old = S.videoTrack;
  try {
    if (old) old.stop(); // iPhone runs one camera at a time; the last frame stays on screen and in the recording.
    S.zoom = 1;
    await openVideo(next);
    S.facing = next;
  } catch (e) {
    toast('Could not switch camera: ' + (e.message || e.name));
    try { await openVideo(S.facing); } catch (_) {}
  } finally { S.switching = false; }
}

// ---------- drawing (preview == recording) ----------
function draw() {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (vw && vh && !S.switching && video.readyState >= 2) {
    const hwApplied = S.hasHw ? currentHwRelative() : 1;
    const digital = Math.max(1, S.zoom / hwApplied);
    const scale = Math.max(OUT_W / vw, OUT_H / vh) * digital;
    const sw = OUT_W / scale, sh = OUT_H / scale;
    ctx.drawImage(video, (vw - sw) / 2, (vh - sh) / 2, sw, sh, 0, 0, OUT_W, OUT_H);
  }
  if (video.requestVideoFrameCallback) video.requestVideoFrameCallback(draw); else requestAnimationFrame(draw);
}
function currentHwRelative() {
  const s = S.videoTrack && S.videoTrack.getSettings ? S.videoTrack.getSettings() : {};
  return (s.zoom || S.hwMin) / S.hwMin;
}

// ---------- zoom ----------
function sliderToZoom(v) { return Math.exp(Math.log(S.maxZoom) * v / 1000); }
function zoomToSlider(z) { return Math.round(1000 * Math.log(z) / Math.log(S.maxZoom)); }

function applyZoom(z, fromCode) {
  z = Math.max(1, Math.min(S.maxZoom, z));
  S.zoom = z;
  $('zoomlabel').textContent = (z < 10 ? z.toFixed(1) : Math.round(z)) + '×';
  if (!fromCode || true) $('zoom').value = zoomToSlider(z);
  for (const b of $('presets').children) b.classList.toggle('on', Math.abs(+b.dataset.z - z) < 0.05);
  if (S.hasHw) { S.pendingHw = Math.min(S.hwMax, S.hwMin * z); pumpHw(); }
}
async function pumpHw() {
  if (S.hwBusy || S.pendingHw == null || !S.videoTrack) return;
  S.hwBusy = true;
  const target = S.pendingHw; S.pendingHw = null;
  try { await S.videoTrack.applyConstraints({ advanced: [{ zoom: target }] }); } catch (_) {}
  S.hwBusy = false;
  if (S.pendingHw != null) pumpHw();
}
function buildPresets() {
  const box = $('presets'); box.innerHTML = '';
  const cands = [1, 2, 3, 5, 10, 25].filter((p) => p < S.maxZoom - 0.05);
  cands.push(S.maxZoom);
  for (const p of cands) {
    const b = document.createElement('button');
    b.dataset.z = p;
    b.textContent = p === S.maxZoom && cands.length > 1 ? 'Max' : (p + '×');
    b.onclick = () => applyZoom(p);
    box.appendChild(b);
  }
}
$('zoom').addEventListener('input', (e) => applyZoom(sliderToZoom(+e.target.value)));

// pinch to zoom, double-tap to flip
let pinch = null, lastTap = 0;
canvas.addEventListener('touchstart', (e) => {
  if (e.touches.length === 2) {
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    pinch = { d, z: S.zoom };
  } else if (e.touches.length === 1) {
    const now = Date.now(); if (now - lastTap < 300) flip(); lastTap = now;
  }
}, { passive: true });
canvas.addEventListener('touchmove', (e) => {
  if (pinch && e.touches.length === 2) {
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    applyZoom(pinch.z * d / pinch.d);
  }
}, { passive: true });
canvas.addEventListener('touchend', (e) => { if (e.touches.length < 2) pinch = null; }, { passive: true });
document.addEventListener('gesturestart', (e) => e.preventDefault());

// ---------- recording ----------
function pickMime() {
  const opts = ['video/mp4;codecs=avc1.640028,mp4a.40.2', 'video/mp4;codecs=avc1,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'];
  return opts.find((m) => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
}
function toggleRecord() { S.recorder ? stopRec() : startRec(); }
function startRec() {
  const out = canvas.captureStream(FPS);
  const tracks = [...out.getVideoTracks()];
  if (S.audioTrack && S.audioTrack.readyState === 'live') tracks.push(S.audioTrack);
  const mime = pickMime();
  let rec;
  try { rec = new MediaRecorder(new MediaStream(tracks), { mimeType: mime, videoBitsPerSecond: 12_000_000, audioBitsPerSecond: 160_000 }); }
  catch (e) { toast('Recording is not available: ' + e.message, 4000); return; }
  S.chunks = [];
  rec.ondataavailable = (e) => { if (e.data && e.data.size) S.chunks.push(e.data); };
  rec.onstop = async () => {
    const type = rec.mimeType || mime || 'video/mp4';
    const blob = new Blob(S.chunks, { type });
    const ext = type.includes('mp4') ? 'mp4' : 'webm';
    const name = 'FlipZoom-' + new Date().toISOString().replace(/[:T]/g, '-').slice(0, 19) + '.' + ext;
    await dbPut({ name, type, blob, created: Date.now(), secs: Math.round((Date.now() - S.recStart) / 1000) });
    S.recorder = null; S.chunks = [];
    document.body.classList.remove('rec');
    releaseWake();
    refreshBadge();
    toast('Saved in Clips. Tap the clip button to save it to Photos.', 3200);
  };
  rec.start(1000);
  S.recorder = rec; S.recStart = Date.now();
  document.body.classList.add('rec');
  holdWake();
  tick();
}
function stopRec() { if (S.recorder && S.recorder.state !== 'inactive') S.recorder.stop(); }
function tick() {
  if (!S.recorder) { $('time').textContent = '00:00'; return; }
  const s = Math.floor((Date.now() - S.recStart) / 1000);
  $('time').textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  setTimeout(tick, 250);
}
async function holdWake() { try { S.wakeLock = await navigator.wakeLock.request('screen'); } catch (_) {} }
function releaseWake() { try { S.wakeLock && S.wakeLock.release(); } catch (_) {} S.wakeLock = null; }
document.addEventListener('visibilitychange', () => { if (document.hidden) stopRec(); });

// ---------- clip storage (IndexedDB, on this phone only) ----------
function db() {
  return db._p || (db._p = new Promise((res, rej) => {
    const r = indexedDB.open('flipzoom', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('clips', { keyPath: 'name' });
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
}
async function tx(mode, fn) {
  const d = await db();
  return new Promise((res, rej) => { const t = d.transaction('clips', mode); const out = fn(t.objectStore('clips')); t.oncomplete = () => res(out && out.result); t.onerror = () => rej(t.error); });
}
const dbPut = (c) => tx('readwrite', (s) => s.put(c));
const dbAll = () => tx('readonly', (s) => s.getAll());
const dbDel = (n) => tx('readwrite', (s) => s.delete(n));

async function refreshBadge() {
  const all = await dbAll().catch(() => []);
  const b = $('badge'); b.textContent = all.length; b.classList.toggle('show', all.length > 0);
}
async function openClips() {
  const list = $('cliplist'); list.innerHTML = '';
  const all = (await dbAll()).sort((a, b) => b.created - a.created);
  if (!all.length) list.innerHTML = '<p>No clips yet.</p>';
  for (const c of all) {
    const url = URL.createObjectURL(c.blob);
    const row = document.createElement('div'); row.className = 'clip';
    row.innerHTML = `<video src="${url}#t=0.1" playsinline muted preload="metadata"></video><div class="meta"><b>${new Date(c.created).toLocaleString()}</b><br>${c.secs}s · ${(c.blob.size / 1e6).toFixed(1)} MB</div>`;
    const btns = document.createElement('div'); btns.className = 'row';
    const save = document.createElement('button'); save.className = 'pill'; save.textContent = 'Save';
    save.onclick = () => saveClip(c, url);
    const del = document.createElement('button'); del.className = 'pill ghost'; del.textContent = 'Delete';
    del.onclick = async () => { if (confirm('Delete this clip from FlipZoom?')) { await dbDel(c.name); openClips(); refreshBadge(); } };
    btns.append(save, del); row.appendChild(btns); list.appendChild(row);
  }
  $('clips').classList.add('show');
}
async function saveClip(c, url) {
  const file = new File([c.blob], c.name, { type: c.type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = url; a.download = c.name; document.body.appendChild(a); a.click(); a.remove();
}

$('start').onclick = start;
$('flip').onclick = flip;
$('shutter').onclick = () => { if (!S.videoTrack) return; toggleRecord(); };
$('clipsbtn').onclick = openClips;
$('closeclips').onclick = () => $('clips').classList.remove('show');
refreshBadge();
if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) $('gateerr').textContent = 'This browser cannot open the camera. Open this page in Safari.';
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
window.__fz = S; // test hook
</script>
</body>
</html>
